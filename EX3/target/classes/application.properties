# ===================================================================
# Configuration de la persistance Hibernate - Gestion de l'état civil
# ===================================================================

# Configuration de la connexion JDBC (MySQL)
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/gestion_etat_civil?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
hibernate.connection.username=root
hibernate.connection.password=

# Dialecte Hibernate
hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Stratégie de génération du schéma DDL
hibernate.hbm2ddl.auto=update

# Journalisation des requêtes SQL
hibernate.show_sql=false
hibernate.format_sql=true

# Taille du pool de connexions
hibernate.connection.pool_size=10

# Alias de compatibilité
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/gestion_etat_civil?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
jdbc.user=root
jdbc.password=
